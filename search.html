<!DOCTYPE html>
<html lang="bn">
<head>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

                        <i class="fa-solid fa-briefcase"></i>
                        <div>চাকরির<span>খবর</span></div>
                    </a>

                    <form class="header-search-form" action="search.html" method="GET">
                        <input type="text" name="q" placeholder="চাকরি বা প্রতিষ্ঠান খুঁজুন..." required>
                        <button type="submit" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </form>
                </div>
            </div>
        </div>

        <nav class="main-nav-bar">
            <div class="container nav-container">
                <button class="mobile-toggle-btn" id="mobile-menu-open" aria-label="Open Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <ul class="nav-menu" id="nav-menu">
                    <button class="mobile-close-btn d-lg-none" id="mobile-menu-close" aria-label="Close Menu">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <li class="nav-item"><a href="index.html" class="nav-link"><i class="fa-solid fa-house me-1"></i> হোম</a></li>

                    <li class="nav-item"><a href="category.html?category=garments" class="nav-link">গার্মেন্টস</a></li>
                    <li class="nav-item"><a href="category.html?category=it" class="nav-link">IT চাকরি</a></li>
                </ul>
            </div>
        </nav>

        </nav>

        <div class="main-layout">
            <section class="main-content">

                    <h2 class="section-title mb-3" id="search-title-text">অনুসন্ধানের ফলাফল</h2>
